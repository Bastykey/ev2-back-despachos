services:
  mysql-despachos:
    image: mysql:8.0
    container_name: mysql-despachos
    environment:
      MYSQL_DATABASE: despachos_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - despachos_data:/var/lib/mysql
    networks:
      - despachos-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-despachos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-despachos
    depends_on:
      mysql-despachos:
        condition: service_healthy
    environment:
      DB_ENDPOINT: mysql-despachos
      DB_PORT: 3306
      DB_NAME: despachos_db
      DB_USER: user
      DB_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-despachos:3306/despachos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8081:8081"
    networks:
      - despachos-net
    restart: unless-stoppedv

volumes:
  despachos_data:

networks:
  despachos-net:
    driver: bridge